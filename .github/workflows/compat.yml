name: Pi compatibility validation
on:
  push:
    branches: [ci/pi15-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 02fbb8cea5aa29f69e3efd3a232aff923e49afe0
      - name: Confirm exact source and runner
        run: |
          test "$(git rev-parse HEAD)" = "02fbb8cea5aa29f69e3efd3a232aff923e49afe0"
          node --version
          npm --version
      - name: Install declared development dependencies
        run: npm ci --ignore-scripts
      - name: Run repository tests
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
